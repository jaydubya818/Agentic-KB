name: Feature Request
description: Suggest an improvement or new feature
title: "[Feature]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem, limitation, or use case does this feature address?
      placeholder: Describe the problem you're trying to solve.
    validations:
      required: true

  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed Change
      description: What would you like to see changed or added?
      placeholder: Describe your proposed solution or feature.
    validations:
      required: true
