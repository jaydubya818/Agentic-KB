name: Bug Report
description: Report a reproducible bug or unexpected behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough information for the issue to be reproduced.

  - type: textarea
    id: what-ran
    attributes:
      label: What did you run?
      description: Describe the command, action, or code that triggered the issue.
      placeholder: |
        Example:
        pnpm run build
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: Describe the expected result.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
      placeholder: Include errors, unexpected output, or other relevant details.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Example: Windows 11, macOS 15, Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "Example: 22.14.0"
    validations:
      required: true

  - type: input
    id: pnpm
    attributes:
      label: pnpm version
      placeholder: "Example: 10.6.2"
    validations:
      required: true

  - type: dropdown
    id: demo-reproduction
    attributes:
      label: Does the issue reproduce against the demo?
      description: Run `pnpm run dev:demo` and check whether the same issue occurs.
      options:
        - "Yes"
        - "No"
        - "I haven't tested the demo"
    validations:
      required: true
