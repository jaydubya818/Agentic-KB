name: test

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  agent-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root deps
        run: npm ci --omit=optional --no-audit --no-fund

      - name: Run full test suite
        run: npm test

      - name: Verify audit chain (if present)
        run: |
          if [ -f logs/audit.log ]; then
            node cli/kb.js agent verify-audit
          else
            echo "no audit.log committed (expected)"
          fi

      - name: Tier read-leak audit (strict)
        run: |
          if [ -f scripts/audit-context-leaks.mjs ]; then
            # Strict: any cross-tier read not declared in the contract's
            # `context_policy.permitted_cross_tier_reads` allowlist fails CI.
            node scripts/audit-context-leaks.mjs --strict --verbose
          else
            echo "tier-leak audit script not yet present"
          fi

      - name: Static wiki lint (orphans/stale) — report-only
        run: |
          if [ -f scripts/static-lint.mjs ]; then
            node scripts/static-lint.mjs --top 0
          else
            echo "static-lint script not yet present"
          fi

      - name: KB health snapshot (advisory)
        if: always()
        run: |
          if grep -q "'health'" cli/kb.js 2>/dev/null; then
            node cli/kb.js health || true
          fi

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # web/ imports shared modules from the repo-root lib/ (e.g.
      # lib/agent-runtime/contracts.mjs), whose dependencies such as `yaml`
      # are declared in the root package.json. Turbopack's root is the repo
      # root (see web/next.config.ts), so those imports resolve from
      # ./node_modules, which must be installed for type-check and build.
      - name: Install root dependencies (shared lib/)
        run: npm ci --omit=optional --no-audit --no-fund

      - name: Install web dependencies
        run: npm --prefix web ci --no-audit --no-fund

      - name: Lint web
        run: npm --prefix web run lint

      - name: Type-check web
        working-directory: web
        run: npx tsc --noEmit

      - name: Build web
        run: npm --prefix web run build

      # Production (shipped) dependencies are gated at high severity.
      # The full tree, including build/lint tooling, is gated at critical:
      # as of 2026-10 the dev-only chain tailwindcss@3 / eslint-config-next
      # -> micromatch/fast-glob -> braces carries a high-severity advisory
      # (GHSA-vfj7-8cjw-p6xm, braces <=3.0.3) with no patched release, so a
      # high gate on dev deps cannot pass until upstream ships a fix.
      - name: Audit web dependencies (production, high)
        run: npm --prefix web audit --omit=dev --audit-level=high

      - name: Audit web dependencies (all, critical)
        run: npm --prefix web audit --audit-level=critical
